[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rancid-ng"
version = "4.0.0"
description = "RANCID-NG: Really Awesome New Cisco confIg Differ - Next Generation (Python 3 rewrite)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "After Dark Systems, LLC", email = "engineering@ipscience.io" },
]
maintainers = [
    { name = "ipscience.io", email = "engineering@ipscience.io" },
]
keywords = [
    "rancid",
    "network",
    "configuration",
    "backup",
    "cisco",
    "juniper",
    "arista",
    "paloalto",
    "router",
    "switch",
    "firewall",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "paramiko>=3.0.0",
    "pexpect>=4.8.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
telnet = [
    "telnetlib3>=2.0.0",
]

[project.scripts]
rancid-ng = "rancid_ng.cli.main:main"
rancid = "rancid_ng.cli.rancid:main"
clogin = "rancid_ng.cli.clogin:main"
jlogin = "rancid_ng.cli.jlogin:main"
hlogin = "rancid_ng.cli.hlogin:main"
flogin = "rancid_ng.cli.flogin:main"
xilogin = "rancid_ng.cli.xilogin:main"
panlogin = "rancid_ng.cli.panlogin:main"
fnlogin = "rancid_ng.cli.fnlogin:main"
noklogin = "rancid_ng.cli.noklogin:main"
mtlogin = "rancid_ng.cli.mtlogin:main"
rancid-run = "rancid_ng.cli.rancid_run:main"
rancid-cvs = "rancid_ng.cli.rancid_cvs:main"
extract-ddi = "rancid_ng.cli.extract_ddi:main"
host2ddi = "rancid_ng.cli.host2ddi:main"

[project.urls]
Homepage = "https://ipscience.io"
Documentation = "https://github.com/straticus1/ipscience-rancid-ng"
Repository = "https://github.com/straticus1/ipscience-rancid-ng"
Issues = "https://github.com/straticus1/ipscience-rancid-ng/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rancid_ng"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/etc",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
