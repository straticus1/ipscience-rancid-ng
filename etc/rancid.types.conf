# RANCID-NG Custom Device Types
#
# This file contains custom device type definitions added by RANCID-NG
# that are not in the original RANCID.
#
# Format: devtype;directive;value[;optional]
#
# Directives:
#   alias     - Map to another device type
#   script    - Collection script to use
#   login     - Login script to use
#   module    - Python module to load
#   inloop    - Main parsing loop function
#   command   - Command and handler: handler;command
#   timeout   - Connection timeout in seconds

# =============================================================================
# NEW DEVICE TYPES - Added by RANCID-NG
# =============================================================================

# Cisco IronPort / AsyncOS (ESA, WSA, SMA)
ironport;script;rancid -t ironport
ironport;login;clogin
ironport;module;ironport
ironport;inloop;ironport::inloop
ironport;timeout;120
ironport;command;ironport::ShowVersion;version
ironport;command;ironport::ShowStatus;status
ironport;command;ironport::ShowLicense;showlicense
ironport;command;ironport::ShowConfig;showconfig
#
esa;alias;ironport
wsa;alias;ironport
sma;alias;ironport
asyncos;alias;ironport

# Proofpoint Email Security
proofpoint;script;rancid -t proofpoint
proofpoint;login;clogin
proofpoint;module;proofpoint
proofpoint;inloop;proofpoint::inloop
proofpoint;timeout;120
proofpoint;command;proofpoint::ShowVersion;version
proofpoint;command;proofpoint::ShowSystem;show system
proofpoint;command;proofpoint::ShowLicense;show license
proofpoint;command;proofpoint::ShowConfig;config export
#
pps;alias;proofpoint

